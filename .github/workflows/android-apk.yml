name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [android/apk-port]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
      - name: Configure NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Build APK
        working-directory: crates/cutcraft
        run: cargo apk build --release --target aarch64-linux-android
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CutCraft-Android-arm64
          path: target/aarch64-linux-android/release/apk/*.apk
          if-no-files-found: error
