name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install web dependencies
        run: npm ci
      - name: Add Capacitor Android runtime
        run: npm install --no-save @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7
      - name: Type-check and build web application
        run: |
          npm run typecheck
          npm run build
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Apply custom launcher icon
        run: bash scripts/configure-android-icon.sh
      - name: Configure Maven Central mirror
        run: |
          find android -type f -name '*.gradle' -exec sed -i '/mavenCentral()/i\\        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }' {} +
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: floorplan-arabic-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
